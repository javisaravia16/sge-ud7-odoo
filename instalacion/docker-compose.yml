# Odoo 19 Community + PostgreSQL 16 para Momo Madroña
# La contraseña de la base de datos va en un archivo .env que NO se sube al repositorio:
#   DB_PASSWORD=la_que_tú_quieras
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos-odoo:/var/lib/odoo
    restart: unless-stopped

volumes:
  datos-db:
  datos-odoo:
